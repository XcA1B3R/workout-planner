name: Deploy Workout Planner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Require original releases
        run: |
          test -s src/index.html
          test -s versions/v2/Workout-Planner-v2.html
          test -s versions/v3/Workout-Planner-v3.html
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site/versions
          cp -R src/. _site/
          rm -f _site/README.md
          cp -R versions/v2 versions/v3 _site/versions/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
